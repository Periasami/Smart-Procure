openapi: 3.0.3

info:
  title: SmartProcure API
  description: |
    REST API for the SMARTPROCURE AI-powered predictive crop
    procurement and queue management system.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Health
    description: Backend health monitoring
  - name: Authentication
    description: User authentication and authorization
  - name: Test
    description: Backend validation testing

paths:

  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check backend health
      description: Returns the current health status of the SmartProcure backend.
      responses:
        "200":
          description: Backend is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                service: SmartProcure Backend
                status: healthy

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account.
      responses:
        "201":
          description: User registered successfully
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates a user and returns authentication information.
      responses:
        "200":
          description: Login successful
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication token
      description: Generates a new authentication token.
      responses:
        "200":
          description: Token refreshed successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logs out the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Returns information about the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user information
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1/test-validation:
    post:
      tags:
        - Test
      summary: Test request validation
      description: |
        Development endpoint used to verify Zod request validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestValidationRequest"
            example:
              name: Agathiya
      responses:
        "200":
          description: Validation successful
        "400":
          $ref: "#/components/responses/ValidationError"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        service:
          type: string
          example: SmartProcure Backend
        status:
          type: string
          example: healthy

    TestValidationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          example: Agathiya

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request data

  responses:

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotImplemented:
      description: Feature is not implemented yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

